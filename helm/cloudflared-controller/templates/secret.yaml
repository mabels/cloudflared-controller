{{- if not .Values.cloudflare.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cfc.fullname" . }}
  labels:
    {{- include "cfc.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLOUDFLARE_ACCOUNT_ID: {{ required "cloudflare.accountId or cloudflare.existingSecret is required" .Values.cloudflare.accountId | quote }}
  CLOUDFLARE_API_TOKEN: {{ required "cloudflare.apiToken or cloudflare.existingSecret is required" .Values.cloudflare.apiToken | quote }}
{{- end }}
